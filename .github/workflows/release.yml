name: Release Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve package version
        id: package-version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $packVersion = $env:GITHUB_REF_NAME
            if ($packVersion -match '^v(.+)$') {
              $packVersion = $Matches[1]
            }
          }
          else {
            [xml]$project = Get-Content -Path 'src\TeslaCamViewer\TeslaCamViewer.csproj'
            $packVersion = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          }

          if (-not $packVersion) {
            throw "Unable to determine a SemVer package version from '$packVersion'."
          }

          if ($packVersion -notmatch '^(\d+)\.(\d+)\.(\d+)') {
            throw "Unable to determine a SemVer package version from '$packVersion'."
          }

          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3]
          $revision = 0
          if ($packVersion -match '(?:preview|alpha|beta|rc)[.-]?(\d+)$') {
            $revision = [int]$Matches[1]
          }

          "packVersion=$packVersion" >> $env:GITHUB_OUTPUT
          "assemblyVersion=$major.$minor.$patch.0" >> $env:GITHUB_OUTPUT
          "fileVersion=$major.$minor.$patch.$revision" >> $env:GITHUB_OUTPUT

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip'
          $zipPath = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'ffmpeg'

          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $ffmpegExe = Get-ChildItem -Path $extractPath -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) {
            throw 'Unable to find ffmpeg.exe in downloaded FFmpeg package.'
          }

          $sourceBin = $ffmpegExe.Directory.FullName
          $targetBin = Join-Path $PWD 'src\TeslaCamViewer\Tools\ffmpeg\bin'
          New-Item -ItemType Directory -Path $targetBin -Force | Out-Null
          Copy-Item -Path (Join-Path $sourceBin '*') -Destination $targetBin -Recurse -Force

      - name: Restore
        run: msbuild src\TeslaCamViewer\TeslaCamViewer.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:Version=${{ steps.package-version.outputs.packVersion }} /p:InformationalVersion=${{ steps.package-version.outputs.packVersion }} /p:AssemblyVersion=${{ steps.package-version.outputs.assemblyVersion }} /p:FileVersion=${{ steps.package-version.outputs.fileVersion }}

      - name: Build
        run: msbuild src\TeslaCamViewer\TeslaCamViewer.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:Version=${{ steps.package-version.outputs.packVersion }} /p:InformationalVersion=${{ steps.package-version.outputs.packVersion }} /p:AssemblyVersion=${{ steps.package-version.outputs.assemblyVersion }} /p:FileVersion=${{ steps.package-version.outputs.fileVersion }} /v:minimal

      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = Join-Path $PWD 'src\TeslaCamViewer\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64'
          $artifactRoot = Join-Path $PWD 'artifacts'
          $stageDir = Join-Path $artifactRoot 'TESLA-Cam-win-x64'
          $zipPath = Join-Path $artifactRoot 'TESLA-Cam-win-x64-portable.zip'
          $checksumPath = Join-Path $artifactRoot 'SHA256SUMS.txt'
          $installScriptPath = Join-Path $artifactRoot 'Install-TESLA-Cam.ps1'
          $uninstallScriptPath = Join-Path $artifactRoot 'Uninstall-TESLA-Cam.ps1'

          if (-not (Test-Path (Join-Path $outputDir 'TeslaCamViewer.exe'))) {
            throw "Build output is missing TeslaCamViewer.exe: $outputDir"
          }

          Remove-Item -Path $artifactRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          robocopy $outputDir $stageDir /E /XD AppPackages /XF *.pdb *.msixsym /NFL /NDL /NJH /NJS /NP
          $robocopyExit = $LASTEXITCODE
          if ($robocopyExit -gt 7) {
            exit $robocopyExit
          }
          $global:LASTEXITCODE = 0

          Copy-Item -Path README.md,INSTALL.md,LICENSE,PRIVACY.md -Destination $stageDir -Force
          Copy-Item -Path docs\legal\THIRD-PARTY-NOTICES.txt -Destination (Join-Path $stageDir 'THIRD-PARTY-NOTICES.txt') -Force
          New-Item -ItemType Directory -Path (Join-Path $stageDir 'scripts') -Force | Out-Null
          Copy-Item -Path scripts\uninstall.ps1 -Destination (Join-Path $stageDir 'scripts\uninstall.ps1') -Force

          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force
          $hash = Get-FileHash -Algorithm SHA256 -Path $zipPath
          "$($hash.Hash)  $(Split-Path $zipPath -Leaf)" | Set-Content -Path $checksumPath -Encoding ASCII
          Copy-Item -Path scripts\install.ps1 -Destination $installScriptPath -Force
          Copy-Item -Path scripts\uninstall.ps1 -Destination $uninstallScriptPath -Force

      - name: Package one-click installer
        shell: pwsh
        env:
          PACK_VERSION: ${{ steps.package-version.outputs.packVersion }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $PWD 'artifacts'
          $stageDir = Join-Path $artifactRoot 'TESLA-Cam-win-x64'
          $installerOutputDir = Join-Path $artifactRoot 'velopack'
          $setupPath = Join-Path $artifactRoot 'TESLA-Cam-win-x64-Setup.exe'
          $notesPath = Join-Path $artifactRoot 'release-notes.md'
          $toolDir = Join-Path $env:RUNNER_TEMP 'vpk'

          if (-not (Test-Path (Join-Path $stageDir 'TeslaCamViewer.exe'))) {
            throw "Installer stage is missing TeslaCamViewer.exe: $stageDir"
          }

          $packVersion = $env:PACK_VERSION

          if (-not $packVersion) {
            throw 'Unable to determine Velopack package version.'
          }

          @"
          TESLA Cam preview installer.

          This setup installs the local-first Windows viewer with immediate raw timeline playback and cached stitched playback for smoother long-drive review, creates shortcuts, and launches the app.
          "@ | Set-Content -Path $notesPath -Encoding UTF8

          Remove-Item -Path $installerOutputDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $toolDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installerOutputDir -Force | Out-Null

          dotnet tool install --tool-path $toolDir vpk --version 1.0.1

          & (Join-Path $toolDir 'vpk.exe') pack `
            --packId TESLACam `
            --packVersion $packVersion `
            --packDir $stageDir `
            --mainExe TeslaCamViewer.exe `
            --packTitle 'TESLA Cam' `
            --packAuthors 'Brandon Temple' `
            --icon 'src\TeslaCamViewer\Assets\AppIcon.ico' `
            --releaseNotes $notesPath `
            --outputDir $installerOutputDir `
            --runtime win-x64 `
            --skipVeloAppCheck `
            --noPortable

          $setupSource = Join-Path $installerOutputDir 'TESLACam-win-Setup.exe'
          if (-not (Test-Path $setupSource)) {
            throw "Velopack setup executable was not produced: $setupSource"
          }

          Copy-Item -Path $setupSource -Destination $setupPath -Force

      - name: Write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $PWD 'artifacts'
          $checksumPath = Join-Path $artifactRoot 'SHA256SUMS.txt'
          $assetNames = @(
            'TESLA-Cam-win-x64-Setup.exe',
            'TESLA-Cam-win-x64-portable.zip',
            'Install-TESLA-Cam.ps1',
            'Uninstall-TESLA-Cam.ps1'
          )

          $lines = foreach ($assetName in $assetNames) {
            $assetPath = Join-Path $artifactRoot $assetName
            if (-not (Test-Path $assetPath)) {
              throw "Missing release asset before checksum generation: $assetPath"
            }

            $hash = Get-FileHash -Algorithm SHA256 -Path $assetPath
            "$($hash.Hash)  $assetName"
          }

          $lines | Set-Content -Path $checksumPath -Encoding ASCII

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TESLA-Cam-win-x64
          path: |
            artifacts/TESLA-Cam-win-x64-Setup.exe
            artifacts/TESLA-Cam-win-x64-portable.zip
            artifacts/velopack/**
            artifacts/SHA256SUMS.txt
            artifacts/Install-TESLA-Cam.ps1
            artifacts/Uninstall-TESLA-Cam.ps1

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $isPrerelease = $tag -match '(?i)(alpha|beta|preview|rc)'
          $notes = @"
          Windows x64 preview build for direct GitHub install.

          What's new in this preview:

          - Removed the default white/glass circle behind the title-bar up-to-date checkmark.
          - Kept the green SF-style checkmark icon visible as the default state with subtle hover and pressed feedback.
          - Preserved the click-to-open update details flyout with current version, update notes, and current feature summary.

          Recommended install:

          1. Download `TESLA-Cam-win-x64-Setup.exe`.
          2. Run it. The one-click setup installs the app under your user profile, creates shortcuts, and launches TESLA Cam.

          The portable zip remains available for users who prefer manual extraction. It includes the self-contained app build, license files, privacy notice, third-party notices, and the LGPL shared FFmpeg runtime used for export and generated physical stitch artifacts. Normal drive review uses virtual playback so opening a long drive does not wait on FFmpeg stitching. The PowerShell installer script remains available as a fallback and verifies the release asset SHA-256 before extracting the package when GitHub provides the asset digest. The uninstall script removes fallback/script installs, shortcuts, and local app data caches unless run with `-KeepAppData`.

          See INSTALL.md in the repository for the full install notes.
          "@

          $velopackAssets = Get-ChildItem -Path 'artifacts\velopack' -Recurse -File | ForEach-Object { $_.FullName }
          $assets = @(
            'artifacts/TESLA-Cam-win-x64-Setup.exe',
            'artifacts/TESLA-Cam-win-x64-portable.zip',
            'artifacts/SHA256SUMS.txt',
            'artifacts/Install-TESLA-Cam.ps1',
            'artifacts/Uninstall-TESLA-Cam.ps1'
          ) + $velopackAssets

          $null = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0

          if ($releaseExists) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "TESLA Cam $tag" --notes $notes
            if ($isPrerelease) {
              gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease
            }
          }
          else {
            $args = @(
              'release', 'create', $tag
            ) + $assets + @(
              '--repo', $env:GITHUB_REPOSITORY,
              '--title', "TESLA Cam $tag",
              '--notes', $notes
            )

            if ($isPrerelease) {
              $args += '--prerelease'
            }

            gh @args
          }
