name: Release Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip'
          $zipPath = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'ffmpeg'

          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $ffmpegExe = Get-ChildItem -Path $extractPath -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) {
            throw 'Unable to find ffmpeg.exe in downloaded FFmpeg package.'
          }

          $sourceBin = $ffmpegExe.Directory.FullName
          $targetBin = Join-Path $PWD 'src\TeslaCamViewer\Tools\ffmpeg\bin'
          New-Item -ItemType Directory -Path $targetBin -Force | Out-Null
          Copy-Item -Path (Join-Path $sourceBin '*') -Destination $targetBin -Recurse -Force

      - name: Restore
        run: msbuild src\TeslaCamViewer\TeslaCamViewer.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        run: msbuild src\TeslaCamViewer\TeslaCamViewer.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = Join-Path $PWD 'src\TeslaCamViewer\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64'
          $artifactRoot = Join-Path $PWD 'artifacts'
          $stageDir = Join-Path $artifactRoot 'TESLA-Cam-win-x64'
          $zipPath = Join-Path $artifactRoot 'TESLA-Cam-win-x64-portable.zip'
          $checksumPath = Join-Path $artifactRoot 'SHA256SUMS.txt'
          $installScriptPath = Join-Path $artifactRoot 'Install-TESLA-Cam.ps1'
          $uninstallScriptPath = Join-Path $artifactRoot 'Uninstall-TESLA-Cam.ps1'

          if (-not (Test-Path (Join-Path $outputDir 'TeslaCamViewer.exe'))) {
            throw "Build output is missing TeslaCamViewer.exe: $outputDir"
          }

          Remove-Item -Path $artifactRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          robocopy $outputDir $stageDir /E /XD AppPackages /XF *.pdb *.msixsym /NFL /NDL /NJH /NJS /NP
          $robocopyExit = $LASTEXITCODE
          if ($robocopyExit -gt 7) {
            exit $robocopyExit
          }
          $global:LASTEXITCODE = 0

          Copy-Item -Path README.md,INSTALL.md,LICENSE,PRIVACY.md -Destination $stageDir -Force
          Copy-Item -Path docs\legal\THIRD-PARTY-NOTICES.txt -Destination (Join-Path $stageDir 'THIRD-PARTY-NOTICES.txt') -Force
          New-Item -ItemType Directory -Path (Join-Path $stageDir 'scripts') -Force | Out-Null
          Copy-Item -Path scripts\uninstall.ps1 -Destination (Join-Path $stageDir 'scripts\uninstall.ps1') -Force

          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force
          $hash = Get-FileHash -Algorithm SHA256 -Path $zipPath
          "$($hash.Hash)  $(Split-Path $zipPath -Leaf)" | Set-Content -Path $checksumPath -Encoding ASCII
          Copy-Item -Path scripts\install.ps1 -Destination $installScriptPath -Force
          Copy-Item -Path scripts\uninstall.ps1 -Destination $uninstallScriptPath -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TESLA-Cam-win-x64
          path: |
            artifacts/TESLA-Cam-win-x64-portable.zip
            artifacts/SHA256SUMS.txt
            artifacts/Install-TESLA-Cam.ps1
            artifacts/Uninstall-TESLA-Cam.ps1

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $isPrerelease = $tag -match '(?i)(alpha|beta|preview|rc)'
          $notes = @"
          Portable Windows x64 build for direct GitHub install.

          The zip includes the self-contained app build, license files, privacy notice, third-party notices, and the LGPL shared FFmpeg runtime used for stitching and export. The installer script verifies the release asset SHA-256 before extracting the package when GitHub provides the asset digest.

          Recommended preview install:

          ```powershell
          powershell -ExecutionPolicy Bypass -File .\Install-TESLA-Cam.ps1 -ReleaseTag $tag
          ```

          See INSTALL.md in the repository for the full install notes.
          "@

          $assets = @(
            'artifacts/TESLA-Cam-win-x64-portable.zip',
            'artifacts/SHA256SUMS.txt',
            'artifacts/Install-TESLA-Cam.ps1',
            'artifacts/Uninstall-TESLA-Cam.ps1'
          )

          $null = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0

          if ($releaseExists) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "TESLA Cam $tag" --notes $notes
            if ($isPrerelease) {
              gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease
            }
          }
          else {
            $args = @(
              'release', 'create', $tag
            ) + $assets + @(
              '--repo', $env:GITHUB_REPOSITORY,
              '--title', "TESLA Cam $tag",
              '--notes', $notes
            )

            if ($isPrerelease) {
              $args += '--prerelease'
            }

            gh @args
          }
